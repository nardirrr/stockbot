name: Pre-Market Telegram Briefing

on:
  schedule:
    # Runs at 06:45 UTC = 07:45 BST (Monday - Friday)
    - cron: '55 13 * * 1-5'
  
  # Adds a "Run workflow" button in GitHub so you can test it manually
  workflow_dispatch:

jobs:
  send-morning-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas
          
      - name: Run Market Bot
        # Securely injects the tokens from GitHub Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
