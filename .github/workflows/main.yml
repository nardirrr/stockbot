name: Financial Intelligence Bot

on:
  schedule:
    - cron: '45 7 * * 1-5'
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # This is you clicking the "Run" button

jobs:
  run-market-logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install yfinance pandas requests

      - name: Determine and Run Mode
        run: |
          # The fix is here: we check for the schedule OR a manual trigger
          if [[ "${{ github.event.schedule }}" == "45 7 * * 1-5" ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Running Morning Report..."
            python scanner.py morning
          else
            echo "Running Volatility Sniper..."
            python scanner.py sniper
          fi
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
